<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Pipe Sizing Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #005A9C; --primary-color-light: #e6f0f9; --secondary-color: #f8f9fa;
            --accent-color: #28a745; --accent-color-dark: #218838; --error-color: #dc3545;
            --error-color-dark: #c82333; --warning-color: #ffc107; --warning-text-color: #5d4902;
            --warning-bg-color: #fff9e6; --text-color: #212529; --text-color-light: #6c757d;
            --border-color: #dee2e6; --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.07); --input-bg: #f8f9fa;
        }

        @keyframes result-flash {
            0% { background-color: var(--primary-color-light); }
            100% { background-color: var(--calculated-bg); }
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--secondary-color); color: var(--text-color); margin: 0;
            padding: 25px; font-size: 16px; line-height: 1.6;
        }
        .container { max-width: 95%; margin: auto; background: #fff; padding: 30px 40px; border-radius: 16px; box-shadow: var(--card-shadow); }
        header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 25px; }
        header h1 { color: var(--primary-color); margin: 0 0 5px 0; font-weight: 700; }
        header p { margin: 0; color: var(--text-color-light); font-size: 1rem; }
        .top-bar { display: flex; flex-direction: column; gap: 20px; margin-bottom: 25px; padding: 15px; background-color: var(--secondary-color); border-radius: 10px; }
        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .control-group { display: flex; align-items: center; gap: 12px; }
        .control-group label { font-weight: 500; color: var(--text-color); }
        .control-group .radio-group { display: flex; padding: 5px; border-radius: 8px; border: 1px solid var(--border-color); background: #fff; }
        .control-group .radio-group input { display: none; }
        .control-group .radio-group label { padding: 6px 14px; cursor: pointer; border-radius: 6px; transition: all 0.3s ease; font-weight: 400; }
        .control-group .radio-group input:checked + label { background-color: var(--primary-color); color: white; box-shadow: 0 2px 5px rgba(0, 90, 156, 0.2); }
        .control-group select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; background-color: #fff; transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        .control-group select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-color-light); outline: none; }
        .button-group button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; color: white; font-weight: 500; transition: background-color 0.3s ease, transform 0.2s ease; }
        .button-group button:hover { transform: translateY(-2px); }
        #add-segment { background-color: var(--accent-color); }
        #add-segment:hover { background-color: var(--accent-color-dark); }
        .delete-segment-btn { background-color: var(--error-color); }
        .delete-segment-btn:hover { background-color: var(--error-color-dark); }
        .project-button { background-color: var(--primary-color); }
        .project-button:hover { background-color: #004175; }

        #main-content-area {
            display: flex;
            gap: 30px;
            padding: 20px 5px;
            overflow-x: auto;
            background-color: #fdfdfd;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            min-height: 600px;
        }

        .line-column {
            flex: 0 0 850px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 0 25px;
            border-right: 2px solid var(--border-color);
        }
        .line-column:last-child { border-right: none; }

        .input-section .card:first-child { margin-top:0; }
        .input-section, .output-section { display: flex; flex-direction: column; }
        .output-section .card { margin-top: 0; }

        .card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: none; transition: box-shadow 0.3s ease; margin-top: 20px; }
        .card:hover { box-shadow: var(--card-shadow); }
        .card h3 { margin: 0; padding: 18px 25px; color: var(--primary-color); border-bottom: 1px solid var(--border-color); font-size: 1.1rem; font-weight: 700; background-color: var(--secondary-color); border-radius: 12px 12px 0 0; }
        .card-content { padding: 25px; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-color-light); }
        .input-with-unit { display: flex; align-items: center; }
        .input-with-unit input, .input-with-unit select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; background-color: #fff; transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        .input-with-unit input:focus, .input-with-unit select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-color-light); }
        .input-with-unit .unit { font-size: 14px; color: var(--text-color-light); margin-left: 10px; white-space: nowrap; }
        
        .output-card { display: none; }
        .output-table { width: 100%; border-collapse: collapse; }
        .output-table th, .output-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .output-table th { background-color: var(--secondary-color); font-weight: 500; }
        .output-table td:nth-child(2), .output-table td:nth-child(3) { text-align: right; font-weight: 500; }
        .output-table .message-cell { text-align: center; font-weight: bold; }
        .message-acceptable { color: #1e6f36; background-color: #eaf6ec; }
        .message-not-acceptable { color: var(--error-color-dark); background-color: #fbe9e7; }
        .line-header { display: flex; justify-content: space-between; align-items: center; }

        .calc-values-table { width: 100%; border-collapse: collapse; }
        .calc-values-table td { padding: 10px; border-bottom: 1px solid var(--border-color); }
        .calc-values-table td:first-child { font-weight: 500; color: var(--text-color-light); }
        .calc-values-table td:last-child { text-align: right; font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Pipe Sizing & Wall Thickness Calculator</h1><p>A professional tool for precise engineering calculations</p></header>

    <div class="top-bar">
        <div class="controls">
            <div class="control-group">
                <label for="project-select">Load Project:</label>
                <select id="project-select" onchange="loadSelectedProject()"></select>
            </div>
            <div class="button-group">
                <button class="project-button" onclick="saveProject()">Save Project</button>
                <button class="project-button" onclick="startNewProject()">New Project</button>
                <button class="delete-segment-btn" onclick="deleteSelectedProject()">Delete Project</button>
            </div>
        </div>
        <div class="controls">
            <div class="control-group"><label>Unit System:</label><select id="unit-system" onchange="switchUnits()"><option value="si">SI</option><option value="imperial">Imperial</option><option value="mks">MKS</option></select></div>
            <div class="control-group"><label>Calculation Mode:</label><div class="radio-group"><input type="radio" id="od-based-radio" name="calc-mode" value="od" checked onchange="switchMode()"><label for="od-based-radio">O.D. Based</label><input type="radio" id="id-based-radio" name="calc-mode" value="id" onchange="switchMode()"><label for="id-based-radio">I.D. Based</label></div></div>
            <div class="button-group"><button id="add-segment" onclick="addSegment()">Add Line</button></div>
        </div>
    </div>

    <div id="main-content-area"></div>
</div>

<template id="segment-template">
    <div class="line-column">
        <div class="input-section">
            <div class="card">
                <div class="line-header">
                    <h3>User Inputs</h3>
                    <button class="delete-segment-btn" style="margin-right: 20px; padding: 5px 10px; font-size: 14px;" onclick="deleteSegment(this)">Delete Line</button>
                </div>
                <div class="card-content">
                    <div class="input-group"><label>Line Designation</label><div class="input-with-unit"><input type="text" data-param="Line Designation"></div></div>
                    <div class="input-group"><label>Fluid System</label><div class="input-with-unit"><input type="text" data-param="Fluid System"></div></div>
                    <div class="input-group"><label>P&ID No.</label><div class="input-with-unit"><input type="text" data-param="P&ID No."></div></div>
                    <div class="input-group"><label>Specific Volume (SV)</label><div class="input-with-unit"><input type="number" step="any" data-param="sv"><span class="unit" data-unit="specificVolume">m³/kg</span></div></div>
                    <div class="input-group"><label>Total Mass Flow Rate (QT)</label><div class="input-with-unit"><input type="number" step="any" data-param="qt"><span class="unit" data-unit="massFlow">kg/hr</span></div></div>
                    <div class="input-group"><label>Maximum Specified Velocity (V)</label><div class="input-with-unit"><input type="number" step="any" data-param="v"><span class="unit" data-unit="velocity">m/s</span></div></div>
                    <div class="input-group"><label>Design Pressure (P)</label><div class="input-with-unit"><input type="number" step="any" data-param="pd"><span class="unit" data-unit="pressure">MPa</span></div></div>
                    <div class="input-group"><label>Design Temperature (TD)</label><div class="input-with-unit"><input type="number" step="any" data-param="td"><span class="unit" data-unit="temperature">°C</span></div></div>
                    <div class="input-group"><label>Material Type</label><div class="input-with-unit"><select data-param="materialType"><option value="CS">Carbon Steel</option><option value="SS">Stainless Steel</option></select></div></div>
                    <div class="input-group"><label>Material of Construction (MOC)</label><div class="input-with-unit"><select data-param="moc">
                        <option>A106 B</option><option>A106 C</option><option>A53 B</option><option>A36</option>
                        <option>A358 TP316L CLASS 1</option><option>A358 TP316L CLASS 3</option><option>A312 TP316L</option>
                    </select></div></div>
                    <div class="input-group"><label>User recommended Pipe NB</label><div class="input-with-unit"><select data-param="nb_selected"></select></div></div>
                    <div class="input-group"><label>Recommended Schedule</label><div class="input-with-unit"><select data-param="sch_selected"></select></div></div>
                    <div class="input-group"><label>User recommended Pipe I.D</label><div class="input-with-unit"><input type="number" step="any" data-param="d_id_user"><span class="unit" data-unit="length_small">mm</span></div></div>
                    <div class="input-group"><label>User recommended Pipe Thickness</label><div class="input-with-unit"><input type="number" step="any" data-param="ts_user"><span class="unit" data-unit="length_small">mm</span></div></div>
                    <div class="input-group"><label>User recommended Pipe O.D.</label><div class="input-with-unit"><input type="number" step="any" data-param="d_od_user"><span class="unit" data-unit="length_small">mm</span></div></div>
                </div>
            </div>
            <div class="card">
                <h3>Mechanical Allowances</h3>
                <div class="card-content">
                    <div class="input-group"><label>Corrosion/Erosion/Threading Allowance (CA)</label><div class="input-with-unit"><input type="number" step="any" data-param="a"><span class="unit" data-unit="length_small">mm</span></div></div>
                    <div class="input-group"><label>Mill Negative Tolerance (TOLM)</label><div class="input-with-unit"><input type="number" step="any" data-param="tolm" value="12.5"><span class="unit">%</span></div></div>
                    <div class="input-group"><label>Manufacturer Tolerance/Welding Ring Allowance (TOLA)</label><div class="input-with-unit"><input type="number" step="any" data-param="tola" value="0"><span class="unit" data-unit="length_small">mm</span></div></div>
                </div>
            </div>
        </div>
        <div class="output-section">
             <div class="card">
                <h3>Calculated Engineering Values</h3>
                <div class="card-content">
                    <table class="calc-values-table">
                        <tbody>
                            <tr><td>Allowable Stress (SE)</td><td data-calc-result="se"></td></tr>
                            <tr><td>Weld Joint Quality Factor (E)</td><td data-calc-result="e"></td></tr>
                            <tr><td>Coefficient Y</td><td data-calc-result="y"></td></tr>
                            <tr><td>Weld Strength Reduction (W)</td><td data-calc-result="w"></td></tr>
                            <tr><td>Min. Required Thickness (Pressure)</td><td data-calc-result="t_pressure"></td></tr>
                            <tr><td>Min. Required Thickness (Final)</td><td data-calc-result="t_final"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card output-card" id="output-od-based">
                <h3>OUTPUT (O.D. Based)</h3>
                <div class="card-content">
                    <table class="output-table">
                        <thead><tr><th>Parameter</th><th>NB (calculated)</th><th>NB (selected)</th></tr></thead>
                        <tbody>
                            <tr><td>Selected Pipe Thickness (mm)</td><td data-result="ts_out_mm_calc"></td><td data-result="ts_out_mm_sel"></td></tr>
                            <tr><td>Selected Pipe Thickness (inch)</td><td data-result="ts_out_in_calc"></td><td data-result="ts_out_in_sel"></td></tr>
                            <tr><td>Pipe I.D (mm)</td><td data-result="id_mm_calc"></td><td data-result="id_mm_sel"></td></tr>
                            <tr><td>Pipe I.D (m)</td><td data-result="id_m_calc"></td><td data-result="id_m_sel"></td></tr>
                            <tr><td>Pipe O.D (mm)</td><td data-result="od_mm_calc"></td><td data-result="od_mm_sel"></td></tr>
                            <tr><td>Pipe NB (inch / DN)</td><td data-result="nb_calc"></td><td data-result="nb_sel"></td></tr>
                            <tr><td>Schedule No.</td><td data-result="sch_calc"></td><td data-result="sch_sel"></td></tr>
                            <tr><td>Calculated Flow Area (m²)</td><td data-result="ar_calc"></td><td data-result="ar_sel"></td></tr>
                            <tr><td>Calculated Velocity (m/s)</td><td data-result="vcalc_calc"></td><td data-result="vcalc_sel"></td></tr>
                            <tr><td>Message</td><td class="message-cell" data-result="msg_calc"></td><td class="message-cell" data-result="msg_sel"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card output-card" id="output-id-based">
                <h3>OUTPUT (I.D. Based)</h3>
                <div class="card-content">
                     <table class="output-table">
                        <thead><tr><th>Parameter</th><th>NB (calculated)</th><th>NB (selected)</th></tr></thead>
                        <tbody>
                            <tr><td>Selected Pipe Thickness (mm)</td><td data-result="ts_out_mm_calc"></td><td data-result="ts_out_mm_sel"></td></tr>
                            <tr><td>Selected Pipe Thickness (inch)</td><td data-result="ts_out_in_calc"></td><td data-result="ts_out_in_sel"></td></tr>
                            <tr><td>Pipe I.D (mm)</td><td data-result="id_mm_calc"></td><td data-result="id_mm_sel"></td></tr>
                            <tr><td>Pipe I.D (m)</td><td data-result="id_m_calc"></td><td data-result="id_m_sel"></td></tr>
                            <tr><td>Pipe O.D (mm)</td><td data-result="od_mm_calc"></td><td data-result="od_mm_sel"></td></tr>
                            <tr><td>Pipe NB (inch / DN)</td><td data-result="nb_calc"></td><td data-result="nb_sel"></td></tr>
                            <tr><td>Schedule No.</td><td data-result="sch_calc"></td><td data-result="sch_sel"></td></tr>
                            <tr><td>Calculated Flow Area (m²)</td><td data-result="ar_calc"></td><td data-result="ar_sel"></td></tr>
                            <tr><td>Calculated Velocity (m/s)</td><td data-result="vcalc_calc"></td><td data-result="vcalc_sel"></td></tr>
                            <tr><td>Message</td><td class="message-cell" data-result="msg_calc"></td><td class="message-cell" data-result="msg_sel"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</template>

    function interpolate(x, xArr, yArr) { if(x<=xArr[0])return yArr[0]; if(x>=xArr[xArr.length-1])return yArr[yArr.length-1]; const i=xArr.findIndex(v=>v>x)-1; if(i<0)return yArr[0]; return yArr[i]+(yArr[i+1]-yArr[i])*(x-xArr[i])/(xArr[i+1]-xArr[i]); }

    function findClosestPipe(reqId, materialType, required_t) {
        const pipeData = engineeringData.pipeDimensions[materialType];
        let bestPipe = null;
        for (const nb in pipeData) {
            for (const sch in pipeData[nb].schedules) {
                const od = pipeData[nb].od_mm;
                const thk = pipeData[nb].schedules[sch];
                const id = od - 2 * thk;
                if (id >= reqId && thk >= required_t) {
                    if (!bestPipe || id < (bestPipe.od - 2 * bestPipe.thickness)) {
                        bestPipe = { nb, sch, od, thickness: thk, dn: pipeData[nb].dn };
                    }
                }
            }
        }
        return bestPipe || { nb: 'N/A', sch: 'N/A', od: 0, thickness: 0, dn: 0 };
    }

    function updateUIDisplay(id) {
        if(!id)return;
        const data=segments[id].data;

    function performCalculations(id) {
        if (!id || !segments[id]) return;
        const p = segments[id].data, si = {};
        const uMap = {sv:'specificVolume',qt:'massFlow',v:'velocity',pd:'pressure',td:'temperature',a:'length_small',tola:'length_small',d_id_user:'length_small',ts_user:'length_small',d_od_user:'length_small'};
        Object.entries(uMap).forEach(([param,unit])=>si[param]=convertValue(p[param]||0,unitConfig[currentUnitSystem][unit],unitConfig.si[unit],unit==='temperature'));
        Object.assign(si, {tolm:p.tolm||0, moc:p.moc, materialType: p.materialType, nb_selected: p.nb_selected, sch_selected: p.sch_selected});
        
        const selPipeData = engineeringData.pipeDimensions[si.materialType]?.[si.nb_selected];
        const selPipeOD = selPipeData?.od_mm || si.d_od_user;

        // --- Engineering Calculations ---
        const td_f = convertValue(si.td, '°C', '°F', true);
        const matDataSE = engineeringData.allowableStress[si.moc] || {temps:[0], values:[0]};
        const matDataW = engineeringData.weldStrengthFactor[si.moc] || {temps:[0], values:[0]};
        const matDataY = engineeringData.coeffY[si.moc] || {temps:[0], values:[0]};
        
        si.se = interpolate(si.td, matDataSE.temps, matDataSE.values);
        si.w = interpolate(td_f, matDataW.temps, matDataW.values);
        si.y = interpolate(td_f, matDataY.temps, matDataY.values);
        si.e = engineeringData.weldJointFactor[si.moc] || 1;

        let t_pressure = 0;
        if ((2 * (si.se * si.e * si.w + si.pd * si.y)) > 0) {
            t_pressure = (si.pd * selPipeOD) / (2 * (si.se * si.e * si.w + si.pd * si.y));
        }
        const t_final = (t_pressure + si.a) / (1 - (si.tolm / 100));
        
        si.qvol=(si.qt*si.sv)/3600; si.ar=si.v>0?si.qvol/si.v:0; si.dr=Math.sqrt(si.ar*4/Math.PI)*1000;
        
        const calcPipe = findClosestPipe(si.dr, si.materialType, t_final);
        const selPipe = { 
            nb: si.nb_selected, sch: si.sch_selected, 
            od: selPipeOD, 
            thickness: selPipeData?.schedules[si.sch_selected] || si.ts_user, 
            dn: selPipeData?.dn || 'user'
        };

        const prefix = `#${id}`;
        document.querySelector(`${prefix} [data-calc-result="se"]`).textContent = `${si.se.toFixed(2)} MPa`;
        document.querySelector(`${prefix} [data-calc-result="e"]`).textContent = si.e.toFixed(2);
        document.querySelector(`${prefix} [data-calc-result="y"]`).textContent = si.y.toFixed(2);
        document.querySelector(`${prefix} [data-calc-result="w"]`).textContent = si.w.toFixed(2);
        document.querySelector(`${prefix} [data-calc-result="t_pressure"]`).textContent = `${t_pressure.toFixed(3)} mm`;
        document.querySelector(`${prefix} [data-calc-result="t_final"]`).textContent = `${t_final.toFixed(3)} mm`;

        const calculateOutput = (pipe, required_t) => {
            const id_mm = pipe.od - (2 * pipe.thickness);
            const ar_m2 = (Math.PI / 4) * Math.pow(id_mm / 1000, 2);
            const vcalc = ar_m2 > 0 ? si.qvol / ar_m2 : 0;
            const isAcceptable = vcalc <= si.v && vcalc > 0 && pipe.thickness >= required_t;
            return {
                ts_mm: pipe.thickness, ts_in: convertValue(pipe.thickness, 'mm', 'in'),
                id_mm: id_mm, id_m: id_mm / 1000, od_mm: pipe.od,
                nb_str: `${pipe.nb} / DN ${pipe.dn}`, sch_str: pipe.sch,
                ar_m2: ar_m2, vcalc: vcalc,
                msg: isAcceptable ? 'Acceptable' : 'Not Acceptable',
                msg_class: isAcceptable ? 'message-acceptable' : 'message-not-acceptable'
            };
        };

        const out_calc = calculateOutput(calcPipe, t_final);
        const out_sel = calculateOutput(selPipe, t_final);

        const render = (type, data) => {
            document.querySelector(`${prefix} [data-result="ts_out_mm_${type}"]`).textContent = data.ts_mm ? data.ts_mm.toFixed(2) : 'N/A';
            document.querySelector(`${prefix} [data-result="ts_out_in_${type}"]`).textContent = data.ts_in ? data.ts_in.toFixed(4) : 'N/A';
            document.querySelector(`${prefix} [data-result="id_mm_${type}"]`).textContent = data.id_mm.toFixed(2);
            document.querySelector(`${prefix} [data-result="id_m_${type}"]`).textContent = data.id_m.toFixed(5);
            document.querySelector(`${prefix} [data-result="od_mm_${type}"]`).textContent = data.od_mm ? data.od_mm.toFixed(2) : 'N/A';
            document.querySelector(`${prefix} [data-result="nb_${type}"]`).textContent = data.nb_str;
            document.querySelector(`${prefix} [data-result="sch_${type}"]`).textContent = data.sch_str;
            document.querySelector(`${prefix} [data-result="ar_${type}"]`).textContent = data.ar_m2.toExponential(4);
            document.querySelector(`${prefix} [data-result="vcalc_${type}"]`).textContent = data.vcalc.toFixed(3);
            const msgCell = document.querySelector(`${prefix} [data-result="msg_${type}"]`);
            msgCell.textContent = data.msg;
            msgCell.className = `message-cell ${data.msg_class}`;
        };
        
        render('calc', out_calc);
        render('sel', out_sel);

        const mode = document.querySelector('input[name="calc-mode"]:checked').value;
        document.getElementById(id).querySelector('#output-od-based').style.display = mode === 'od' ? 'block' : 'none';
        document.getElementById(id).querySelector('#output-id-based').style.display = mode === 'id' ? 'block' : 'none';
    }
</script>

</body>
</html>
